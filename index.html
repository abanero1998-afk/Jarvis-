<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>JARVIS HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#050814;color:#d7f6ff;font-family:Inter,system-ui,sans-serif}
#jarvis-os{height:100%;position:relative;background-image:radial-gradient(#16304a 1px,transparent 1px);background-size:22px 22px}
#hud-frame{position:absolute;inset:0;z-index:1;pointer-events:none}
#jarvis-core{position:absolute;left:50%;top:44%;width:210px;height:210px;margin:-105px 0 0 -105px;z-index:3;transition:top .55s,transform .55s}
#jarvis-os.on #jarvis-core{top:74px;transform:scale(.55);margin-top:0}
#core-svg{position:absolute;inset:-18px;width:246px;height:246px}
.halo-lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:2;font-family:Orbitron,monospace}
.halo-lab b{letter-spacing:.4em;color:#00E5FF;font-size:15px;text-shadow:0 0 18px #00E5FF}
.halo-lab span{margin-top:6px;font-size:11px;color:#7d93a8;letter-spacing:.2em}
#home-canvas{position:absolute;top:8px;left:10px;right:10px;bottom:90px;z-index:5;overflow:auto;opacity:0;pointer-events:none;transform:translateY(16px);transition:.45s}
#jarvis-os.on #home-canvas{opacity:1;pointer-events:auto;transform:none}
#home-canvas .pad{max-width:560px;margin:70px auto 0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:rgba(8,20,36,.62);border:1px solid rgba(0,217,255,.22);border-radius:18px;padding:11px;backdrop-filter:blur(16px)}
.card b{display:block;font-size:19px}.card span{font-size:10px;letter-spacing:1px;color:#7fa0b5}
.up{color:#30D158;font-size:11px}.dn{color:#7fa0b5;font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.insight{margin-top:8px;border:1px solid rgba(0,217,255,.28);background:rgba(0,217,255,.07);border-radius:16px;padding:10px;font-size:13px;white-space:pre-wrap}
.status{font-size:10px;letter-spacing:2px;color:#00D9FF;margin-bottom:6px}
.gen-img{width:100%;border-radius:14px;margin:8px 0;border:1px solid rgba(0,217,255,.3)}
#chat-dock{position:absolute;left:0;right:0;bottom:0;height:82px;z-index:20;background:rgba(6,12,22,.72);backdrop-filter:blur(28px);border-top:1px solid rgba(0,217,255,.22);display:flex;align-items:center;gap:6px;padding:0 8px;transition:.4s}
#jarvis-os.busy #chat-dock{transform:translateY(48px);opacity:.55}
#chat-dock input{flex:1;height:44px;border-radius:999px;border:1px solid rgba(0,217,255,.2);background:#050814;color:#fff;padding:0 12px;outline:none;min-width:0}
#chat-dock button{height:40px;border-radius:999px;border:1px solid rgba(0,217,255,.35);background:rgba(0,217,255,.08);color:#00D9FF;padding:0 8px;font-size:10px;white-space:nowrap}
#chat-dock button.on{border-color:#00E5FF;color:#00E5FF}
.jarvis-hud{position:absolute;inset:0;z-index:15;pointer-events:none;font-family:Orbitron,monospace;display:none}
.jarvis-hud.show{display:block}
.hud-win{pointer-events:auto;position:absolute;background:rgba(5,5,8,.9);border:1px solid rgba(0,229,255,.5);border-radius:18px;overflow:hidden}
.hud-header{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:9px;letter-spacing:1.5px;color:#00E5FF;border-bottom:1px solid rgba(0,229,255,.35)}
.hud-iframe{width:100%;height:calc(100% - 36px);border:none;background:#000}
#hud-site{left:14px;top:78px;width:min(420px,46vw);height:min(560px,calc(100% - 170px));position:absolute}
#hud-ig{right:14px;top:78px;width:min(420px,46vw);height:min(560px,calc(100% - 170px));position:absolute}
#ig-images{height:calc(100% - 36px);padding:12px;font-size:11px;color:#7fa0b5}
</style></head>
<body>
<div id="jarvis-os">
  <svg id="hud-frame"></svg>
  <div id="jarvis-core">
    <svg id="core-svg"></svg>
    <div class="halo-lab"><b>JARVIS</b><span id="clock">--:--</span></div>
  </div>
  <div id="home-canvas"><div class="pad" id="canvas"></div></div>
  <div class="jarvis-hud" id="liveHud">
    <div class="hud-win" id="hud-site">
      <div class="hud-header"><span>SITE_LIVE</span><span style="color:#2ECC71">ONLINE</span></div>
      <iframe class="hud-iframe" src="https://mente-locale-premium.vercel.app/"></iframe>
    </div>
    <div class="hud-win" id="hud-ig">
      <div class="hud-header"><span>IG @SMART.SRLS.IA</span><a href="https://www.instagram.com/smart.srls.ia" target="_blank" style="color:#00E5FF">OPEN</a></div>
      <div id="ig-images">Instagram Graph API per feed foto.</div>
    </div>
  </div>
  <div id="chat-dock">
    <button id="btnCam">CAM</button>
    <button id="btnMic">MIC</button>
    <button id="btnLive">LIVE</button>
    <input id="chatInput" placeholder="genera post instagram..." autocomplete="off">
    <button id="btnSend">OK</button>
    <button id="btnRep">REPORT</button>
  </div>
</div>
<script>
(function(){
  const OS=document.getElementById("jarvis-os"), canvas=document.getElementById("canvas"), input=document.getElementById("chatInput");
  const liveHud=document.getElementById("liveHud");
  const API=location.origin, SB="https://qnpdilurpkjsqloznmko.supabase.co", KEY="sb_publishable_VbIkIFYgrPzic5nXJXISZw_Q9LIhN--";
  let audioObj=null,recognition=null,listening=false,charts=[],liveOn=false;
  function frame(){const svg=d3.select("#hud-frame");svg.selectAll("*").remove();const w=innerWidth,h=innerHeight,p=14;const g=svg.attr("viewBox","0 0 "+w+" "+h).append("g").attr("stroke","#00D9FF").attr("fill","none").attr("stroke-width",1.2);const L=22;[[p,p,1,1],[w-p,p,-1,1],[p,h-p-84,1,-1],[w-p,h-p-84,-1,-1]].forEach(([x,y,sx,sy])=>{g.append("path").attr("d","M"+(x+L*sx)+","+y+" H"+x+" V"+(y+L*sy));});}
  function core(){const svg=d3.select("#core-svg");svg.selectAll("*").remove();const c=123;const ring=(r,op,w,dash,dur)=>{const p=svg.append("circle").attr("cx",c).attr("cy",c).attr("r",r).attr("fill","none").attr("stroke","#00E5FF").attr("stroke-width",w).attr("stroke-opacity",op);if(dash)p.attr("stroke-dasharray",dash);p.append("animateTransform").attr("attributeName","transform").attr("type","rotate").attr("from","0 "+c+" "+c).attr("to","360 "+c+" "+c).attr("dur",dur).attr("repeatCount","indefinite");};ring(96,.3,1,"","18s");ring(88,.95,2,"20 12","10s");ring(76,.4,1,"8 10","14s");}
  addEventListener("resize",frame);frame();core();
  function tick(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});}
  setInterval(tick,1000);tick();
  function openHome(){OS.classList.add("on");}
  function busy(v){OS.classList.toggle("busy",!!v);}
  function speak(t){const line=String(t||"").replace(/\s+/g," ").slice(0,280);fetch(API+"/api/speak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:line})}).then(r=>r.ok?r.blob():Promise.reject()).then(b=>{if(audioObj)audioObj.pause();audioObj=new Audio(URL.createObjectURL(b));audioObj.play().catch(()=>{});}).catch(()=>{try{const u=new SpeechSynthesisUtterance(line);u.lang="it-IT";speechSynthesis.speak(u);}catch(e){}});}
  function toggleLive(force){liveOn=typeof force==="boolean"?force:!liveOn;liveHud.classList.toggle("show",liveOn);document.getElementById("btnLive").classList.toggle("on",liveOn);if(liveOn){openHome();speak("Live online.");}else speak("Live chiuso.");}
  function kind(s){s=s.toLowerCase();if(/genera (post|immagine|visual)|post instagram|immagine ig|crea post/i.test(s))return"img";if(/instagram|\big\b|sito live|apri sito|live/i.test(s))return"live";if(/fattoria|agritur|orto|km0/i.test(s))return"farm";if(/come si|processo|flusso|schema|procedura/i.test(s))return"flow";if(/report|incass|vendit|scontrin|quanto|dashboard|kpi/i.test(s))return"dash";if(/aggiungi|manda|apri tavolo/i.test(s))return"ops";return"talk";}
  async function orders(){const rows=await fetch(SB+"/rest/v1/tm_orders?id=eq.main&select=data",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}}).then(r=>r.json());return (rows[0]&&rows[0].data)||[];}
  function day(d){return d?new Date(d).toDateString():"";}
  function pack(list){const t=new Date(),y=new Date();y.setDate(y.getDate()-1);const tod=list.filter(o=>day(o.createdAt)===t.toDateString()||day(o.paidAt)===t.toDateString());const yod=list.filter(o=>day(o.paidAt||o.createdAt)===y.toDateString()&&(o.status==="pagato"||o.paidAt));const paid=tod.filter(o=>o.status==="pagato"||o.paidAt);const att=list.filter(o=>["inviato","in_preparazione","pronto"].includes(o.status));const inc=paid.reduce((s,o)=>s+Number(o.total||0),0),yinc=yod.reduce((s,o)=>s+Number(o.total||0),0);const pezzi=tod.reduce((s,o)=>s+(o.items||[]).reduce((a,i)=>a+Number(i.qty||1),0),0);const hours=Array(24).fill(0);paid.forEach(o=>hours[new Date(o.paidAt||o.createdAt).getHours()]+=Number(o.total||0));const prod={};tod.forEach(o=>(o.items||[]).forEach(i=>{const n=i.name||"?";prod[n]=(prod[n]||0)+Number(i.qty||1);}));const top=Object.entries(prod).sort((a,b)=>b[1]-a[1]).slice(0,5);const occ=new Set(att.map(o=>o.tableId)).size;const dlt=(a,b)=>b?Math.round(((a-b)/b)*100):0;return{inc,dInc:dlt(inc,yinc),medio:paid.length?inc/paid.length:0,pezzi,hours,top,occ,lib:Math.max(0,28-occ)};}
  function wipe(){charts.forEach(c=>c.destroy&&c.destroy());charts=[];canvas.innerHTML="";}
  function renderDash(d){openHome();wipe();canvas.innerHTML=`<div class="status">REPORT</div><div class="kpis"><div class="card"><span>INCASSO</span><b>${d.inc.toFixed(2)}€</b></div><div class="card"><span>SCONTRINO</span><b>${d.medio.toFixed(2)}€</b></div><div class="card"><span>PEZZI</span><b>${d.pezzi}</b></div><div class="card"><span>TAVOLI</span><b>${d.occ}/${d.occ+d.lib}</b></div></div><div class="insight" id="riassuntoBox"></div>`;}
  async function downloadReportJson(){const b=await fetch(API+"/api/backup").then(r=>r.json());const blob=new Blob([JSON.stringify(b,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="teste-matte-report-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();return b;}
  async function run(text){
    busy(true);
    const k=kind(text);
    const isReport=/report/i.test(text);
    openHome();
    if(k==="live") toggleLive(true);
    else if(k==="dash"){try{renderDash(pack(await orders())); if(isReport){const b=await downloadReportJson(); const el=document.getElementById("riassuntoBox"); if(el&&b.riassunto_it) el.textContent=b.riassunto_it;}}catch(e){wipe();canvas.innerHTML="<div class=card>Errore dati</div>";}}
    else if(k!=="img"){wipe();canvas.innerHTML="<div class=status>HOME</div><div class=card><b>In ascolto</b></div>";}
    else {wipe();canvas.innerHTML="<div class=status>POST IG</div><div class=card><b>Genero visual...</b></div>";}
    if(k!=="live"){
      try{
        const res=await fetch(API+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});
        const data=await res.json();
        const reply=data.risposta||"Fatto.";
        speak(reply);
        if(data.image_url){
          wipe();
          canvas.innerHTML="<div class=status>POST GENERATO</div>";
          const im=document.createElement("img");im.className="gen-img";im.src=data.image_url;im.alt="post IG";canvas.appendChild(im);
        }
        const box=document.createElement("div");box.className="insight";box.textContent=reply;canvas.appendChild(box);
        if(data.download&&!isReport){try{await downloadReportJson();}catch(e){}}
      }catch(e){canvas.innerHTML="<div class=card>Errore rete</div>";}
    }
    busy(false);
  }
  function send(){const t=input.value.trim();if(!t)return;input.value="";run(t);}
  document.getElementById("btnSend").onclick=send;
  input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();send();}});
  document.getElementById("btnRep").onclick=()=>run("report giornaliero");
  document.getElementById("btnLive").onclick=()=>toggleLive();
  document.getElementById("btnMic").onclick=function(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;if(!recognition){recognition=new SR();recognition.lang="it-IT";recognition.onresult=e=>{input.value=e.results[0][0].transcript;send();};recognition.onend=()=>{listening=false;document.getElementById("btnMic").classList.remove("on");};}if(!listening){listening=true;document.getElementById("btnMic").classList.add("on");recognition.start();}else recognition.stop();};
  document.getElementById("btnCam").onclick=async function(){openHome();wipe();try{const s=await navigator.mediaDevices.getUserMedia({video:true});const v=document.createElement("video");v.autoplay=true;v.playsInline=true;v.style.width="100%";v.srcObject=s;canvas.appendChild(v);}catch(e){speak("Camera negata.");}};
  speak("Sistemi online.");
})();
</script></body></html>
