<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS · Teste Matte</title>
<style>
  :root {
    --bg: #06070a;
    --grid: rgba(45, 166, 176, 0.08);
    --teal: #2da6b0;
    --teal-l: #5fd8e0;
    --glow: rgba(45, 166, 176, 0.6);
    --ink: #e8f4f4;
    --muted: #7a8f92;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  body {
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 20px;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(180deg, rgba(6,7,10,0.9), transparent);
    z-index: 20;
  }
  .brand { font-size: 13px; letter-spacing: 3px; color: var(--teal-l); opacity: 0.7; }
  .status {
    font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #47c98a; box-shadow: 0 0 10px #47c98a;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .center {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 24px;
  }
  .ring-wrap {
    position: relative; width: 200px; height: 200px;
  }
  .ring {
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 2px solid var(--teal);
    box-shadow:
      0 0 20px var(--glow),
      0 0 60px rgba(45,166,176,0.25),
      inset 0 0 30px rgba(45,166,176,0.15);
    animation: spin 12s linear infinite;
    position: relative;
  }
  .ring::before {
    content: '';
    position: absolute; inset: 12px;
    border-radius: 50%;
    border: 1px solid rgba(95,216,224,0.4);
  }
  .ring::after {
    content: '';
    position: absolute; inset: -8px;
    border-radius: 50%;
    border: 1px dashed rgba(45,166,176,0.3);
    animation: spin 20s linear infinite reverse;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .ring-label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 4px;
    pointer-events: none;
  }
  .ring-label b {
    font-size: 26px; letter-spacing: 6px;
    color: var(--teal-l);
    text-shadow: 0 0 20px var(--glow);
  }
  .ring-label span {
    font-size: 11px; letter-spacing: 2px; color: var(--muted);
  }
  .chat-panel {
    position: absolute;
    bottom: 90px; left: 12px; right: 12px;
    max-width: 420px;
    margin: 0 auto;
    height: 220px;
    background: rgba(11,13,17,0.92);
    border: 1px solid rgba(45,166,176,0.35);
    border-radius: 14px;
    backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 30;
  }
  .chat-header {
    padding: 10px 14px;
    font-size: 11px; letter-spacing: 2px; color: var(--teal-l);
    border-bottom: 1px solid rgba(45,166,176,0.15);
  }
  .chat-log {
    flex: 1; overflow-y: auto; padding: 12px;
    font-size: 14px; line-height: 1.5;
  }
  .chat-log .user { color: var(--muted); margin-bottom: 8px; }
  .chat-log .jarvis { color: var(--teal-l); margin-bottom: 12px; font-weight: 500; }
  .chat-input-row {
    display: flex; border-top: 1px solid rgba(45,166,176,0.15);
  }
  .chat-input-row input {
    flex: 1; background: transparent; border: none;
    padding: 14px; color: var(--ink); font-size: 15px; outline: none;
  }
  .chat-input-row button {
    background: transparent; border: none; color: var(--teal);
    padding: 0 16px; cursor: pointer; font-size: 18px;
  }
  .controls {
    position: absolute; bottom: 20px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 12px;
    z-index: 40;
  }
  .btn {
    padding: 11px 18px;
    border-radius: 99px;
    border: 1px solid rgba(45,166,176,0.4);
    background: rgba(45,166,176,0.12);
    color: var(--teal-l);
    font-size: 12px; letter-spacing: 1px;
    cursor: pointer;
  }
  .btn.active {
    background: rgba(45,166,176,0.3);
    box-shadow: 0 0 16px var(--glow);
  }
  .btn.mic.active {
    background: rgba(226,87,76,0.25);
    border-color: #e2574c;
    color: #ff8a80;
  }
  .status-text {
    position: absolute; bottom: 70px; left: 0; right: 0;
    text-align: center;
    font-size: 13px; color: var(--muted);
    letter-spacing: 1px;
    z-index: 20;
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">TESTE MATTE · JARVIS</div>
    <div class="status"><span class="dot"></span> ONLINE</div>
  </div>

  <div class="center">
    <div class="ring-wrap">
      <div class="ring"></div>
      <div class="ring-label">
        <b>JARVIS</b>
        <span id="timeLabel">--:--</span>
      </div>
    </div>
  </div>

  <div class="status-text" id="statusText">Scrivi qui sotto o di' "Okay Jarvis"</div>

  <div class="chat-panel" id="chatPanel">
    <div class="chat-header">CHAT</div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <input id="chatInput" placeholder="Scrivi un messaggio..." autocomplete="off">
      <button id="btnSend">➤</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="btnCam">CAMERA</button>
    <button class="btn mic" id="btnMic">MIC</button>
  </div>

<script>
(function() {
  const statusEl = document.getElementById("statusText");
  const logEl = document.getElementById("chatLog");
  const inputEl = document.getElementById("chatInput");
  const btnSend = document.getElementById("btnSend");
  const btnMic = document.getElementById("btnMic");
  const btnCam = document.getElementById("btnCam");
  const timeEl = document.getElementById("timeLabel");

  let listening = false;
  let recognition = null;

  function tick() {
    const now = new Date();
    timeEl.textContent = now.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  }
  setInterval(tick, 1000);
  tick();

  function addLog(who, text) {
    const div = document.createElement("div");
    div.className = who;
    div.textContent = (who === "user" ? "Tu: " : "Jarvis: ") + text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function speak(text) {
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "it-IT";
      u.rate = 1.05;
      window.speechSynthesis.speak(u);
    } catch (e) {}
    statusEl.textContent = text;
  }

  function reply(text) {
    const t = (text || "").toLowerCase();
    if (t.includes("ciao") || t.includes("sei lì") || t.includes("sei li") || t.includes("are you there")) {
      return "A disposizione, signore.";
    }
    if (t.includes("pronto") || t.includes("ready")) {
      return "Sono pronto, signore.";
    }
    if (t.includes("camera") || t.includes("telecamera")) {
      return "Apro la camera.";
    }
    if (t.includes("grazie")) {
      return "Di nulla, signore.";
    }
    if (t.includes("ordini") || t.includes("comanda") || t.includes("tavolo")) {
      return "Dimmi pure il tavolo e i piatti da inviare.";
    }
    return "Ricevuto. In che modo posso assisterla?";
  }

  function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    addLog("user", text);
    statusEl.textContent = "Elaboro...";
    setTimeout(function() {
      const r = reply(text);
      addLog("jarvis", r);
      speak(r);
    }, 300);
  }

  btnSend.addEventListener("click", send);
  inputEl.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      send();
    }
  });

  btnMic.addEventListener("click", function() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      statusEl.textContent = "Microfono non supportato su questo browser";
      return;
    }
    if (!recognition) {
      recognition = new SR();
      recognition.lang = "it-IT";
      recognition.continuous = false;
      recognition.onresult = function(e) {
        const text = e.results[0][0].transcript;
        inputEl.value = text;
        send();
      };
      recognition.onerror = function() {
        statusEl.textContent = "Errore microfono";
        listening = false;
        btnMic.classList.remove("active");
      };
      recognition.onend = function() {
        listening = false;
        btnMic.classList.remove("active");
      };
    }
    if (!listening) {
      listening = true;
      btnMic.classList.add("active");
      statusEl.textContent = "Parla ora...";
      try { recognition.start(); } catch (e) {}
    } else {
      recognition.stop();
      listening = false;
      btnMic.classList.remove("active");
    }
  });

  btnCam.addEventListener("click", function() {
    statusEl.textContent = "Camera non ancora collegata su mobile";
    speak("Camera non disponibile su questo dispositivo.");
  });

  setTimeout(function() {
    addLog("jarvis", "Sistemi online. A disposizione, signore.");
    speak("Sistemi online. A disposizione, signore.");
  }, 600);

  setTimeout(function() { inputEl.focus(); }, 800);
})();
</script>
</body>
</html>
