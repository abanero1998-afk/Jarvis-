<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>JARVIS HOME OS</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#080C18;color:#e8f4ff;font-family:Inter,system-ui,sans-serif}
#jarvis-os{height:100%;position:relative;background-image:radial-gradient(#1a2a4a 1px,transparent 1px);background-size:24px 24px}
#jarvis-core{position:absolute;left:50%;top:46%;width:200px;height:200px;margin:-100px 0 0 -100px;transition:transform .55s cubic-bezier(.2,.8,.2,1),top .55s;z-index:2}
#jarvis-os.on #jarvis-core{top:86px;transform:scale(.62);margin-top:0}
.halo{width:100%;height:100%;border-radius:50%;border:2px solid #00D9FF;box-shadow:0 0 40px rgba(0,217,255,.45);background:rgba(0,0,0,.55);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;flex-direction:column;animation:pulse 3.2s ease-in-out infinite}
.halo b{letter-spacing:.35em;font-size:14px;color:#00D9FF}
.halo span{margin-top:6px;font-size:11px;color:#7d8ea3;letter-spacing:.2em}
@keyframes pulse{50%{box-shadow:0 0 56px rgba(0,217,255,.7)}}
#home-canvas{position:absolute;top:10px;left:10px;right:10px;bottom:92px;z-index:5;overflow:auto;padding:8px;opacity:0;pointer-events:none;transform:translateY(18px);transition:opacity .45s,transform .45s}
#jarvis-os.on #home-canvas{opacity:1;pointer-events:auto;transform:none}
#home-canvas .pad{max-width:560px;margin:78px auto 0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:rgba(255,255,255,.05);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:12px}
.card b{display:block;font-size:20px}
.card span{font-size:10px;letter-spacing:1px;color:#8aa0b3}
.up{color:#30D158;font-size:11px}.dn{color:#FF3B30;font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.flow{display:flex;gap:6px;align-items:center;margin-top:10px}
.flow .card{flex:1;text-align:center}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pics img{width:100%;height:78px;object-fit:cover;border-radius:16px;border:1px solid rgba(0,217,255,.2)}
.insight{margin-top:8px;background:rgba(0,217,255,.08);border:1px solid rgba(0,217,255,.25);border-radius:20px;padding:12px;font-size:13px}
.status{font-size:11px;color:#00D9FF;letter-spacing:1px;margin-bottom:6px}
#chat-dock{position:absolute;left:0;right:0;bottom:0;height:84px;z-index:8;background:rgba(255,255,255,.05);backdrop-filter:blur(30px);border-top:1px solid rgba(0,217,255,.2);display:flex;align-items:center;gap:8px;padding:0 12px;transition:transform .4s,opacity .4s}
#jarvis-os.busy #chat-dock{transform:translateY(52px);opacity:.6}
#chat-dock input{flex:1;height:46px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.5);color:#fff;padding:0 16px;outline:none}
#chat-dock input:focus{border-color:rgba(0,217,255,.5)}
#chat-dock button{height:42px;border-radius:999px;border:1px solid rgba(0,217,255,.35);background:rgba(0,217,255,.1);color:#00D9FF;padding:0 12px;font-size:11px;letter-spacing:1px}
#chat-dock button.mic.on{border-color:#FF3B30;color:#ff8a80}
</style></head>
<body>
<div id="jarvis-os">
  <div id="jarvis-core"><div class="halo"><b>JARVIS</b><span id="clock">--:--</span></div></div>
  <div id="home-canvas"><div class="pad" id="canvas"></div></div>
  <div id="chat-dock">
    <button id="btnCam">CAM</button>
    <button class="mic" id="btnMic">MIC</button>
    <input id="chatInput" placeholder="Telecomando Jarvis..." autocomplete="off">
    <button id="btnSend">OK</button>
    <button id="btnRep">REPORT</button>
  </div>
</div>
<script>
(function(){
  const OS=document.getElementById("jarvis-os");
  const canvas=document.getElementById("canvas");
  const input=document.getElementById("chatInput");
  const API=location.origin, SB="https://qnpdilurpkjsqloznmko.supabase.co", KEY="sb_publishable_VbIkIFYgrPzic5nXJXISZw_Q9LIhN--";
  let audioObj=null,recognition=null,listening=false,charts=[];
  function tick(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});}
  setInterval(tick,1000);tick();
  function openHome(){OS.classList.add("on");}
  function busy(on){OS.classList.toggle("busy",!!on);}
  function speak(t){const line=String(t||"").replace(/\s+/g," ").slice(0,220);fetch(API+"/api/speak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:line})}).then(r=>r.ok?r.blob():Promise.reject()).then(b=>{if(audioObj)audioObj.pause();audioObj=new Audio(URL.createObjectURL(b));audioObj.play().catch(()=>{});}).catch(()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(line);u.lang="it-IT";speechSynthesis.speak(u);}catch(e){}});}
  function kind(s){s=s.toLowerCase();if(/fattoria|agritur|orto|cantiere|km0|nuovo ristorante/i.test(s))return"farm";if(/come si|processo|flusso|passaggi|schema|procedura|turni|camera/i.test(s))return"flow";if(/report|incass|vendit|soldi|euro|scontrin|quanto|coca|tacos|tavoli|oggi|dashboard|aggiungi|manda|apri tavolo/i.test(s))return"dash";return"talk";}
  async function orders(){const rows=await fetch(SB+"/rest/v1/tm_orders?id=eq.main&select=data",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}}).then(r=>r.json());return (rows[0]&&rows[0].data)||[];}
  function day(d){return d?new Date(d).toDateString():"";}
  function pack(list,filter){
    const t=new Date(), y=new Date(); y.setDate(y.getDate()-1);
    const tod=list.filter(o=>day(o.createdAt)===t.toDateString()||day(o.paidAt)===t.toDateString());
    const yod=list.filter(o=>day(o.paidAt||o.createdAt)===y.toDateString()&&(o.status==="pagato"||o.paidAt));
    const paid=tod.filter(o=>o.status==="pagato"||o.paidAt);
    const att=list.filter(o=>["inviato","in_preparazione","pronto"].includes(o.status));
    const inc=paid.reduce((s,o)=>s+Number(o.total||0),0), yinc=yod.reduce((s,o)=>s+Number(o.total||0),0);
    const pezzi=tod.reduce((s,o)=>s+(o.items||[]).reduce((a,i)=>a+Number(i.qty||1),0),0);
    const hours=Array(24).fill(0); paid.forEach(o=>hours[new Date(o.paidAt||o.createdAt).getHours()]+=Number(o.total||0));
    const prod={}; tod.forEach(o=>(o.items||[]).forEach(i=>{const n=i.name||"?"; if(filter&&!n.toLowerCase().includes(filter))return; prod[n]=(prod[n]||0)+Number(i.qty||1);}));
    const top=Object.entries(prod).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const occ=new Set(att.map(o=>o.tableId)).size;
    const dlt=(a,b)=>b?Math.round(((a-b)/b)*100):0;
    const insights=[top[0]?top[0][0]+" top di oggi x"+top[0][1]:"Pochi pezzi oggi.", att.length?att.length+" comande aperte.":"Sala scarica.", "Picco ore "+hours.indexOf(Math.max.apply(null,hours.concat([0])))+":00"];
    return {inc,dInc:dlt(inc,yinc),medio:paid.length?inc/paid.length:0,pezzi,paid:paid.length,att:att.length,hours,top,occ,lib:Math.max(0,28-occ),insights};
  }
  function wipe(){charts.forEach(c=>c.destroy&&c.destroy());charts=[];canvas.innerHTML="";}
  function renderDash(d,note){
    openHome(); wipe();
    canvas.innerHTML=`<div class="status">HOME · DASHBOARD</div>
      <div class="kpis">
        <div class="card"><span>INCASSO OGGI</span><b>${d.inc.toFixed(2)}€</b><div class="${d.dInc>=0?"up":"dn"}">${d.dInc>=0?"+":""}${d.dInc}% vs ieri</div></div>
        <div class="card"><span>SCONTRINO</span><b>${d.medio.toFixed(2)}€</b></div>
        <div class="card"><span>PIATTI</span><b>${d.pezzi}</b></div>
        <div class="card"><span>TAVOLI LIVE</span><b>${d.occ}/${d.occ+d.lib}</b></div></div>
      <div class="grid2"><div class="card"><span>VENDITE ORA</span><canvas id="c1" height="110"></canvas></div><div class="card"><span>TOP</span><canvas id="c2" height="110"></canvas></div></div>
      <div class="card" style="margin-top:8px"><span>OCCUPAZIONE</span><canvas id="c3" height="90"></canvas></div>
      <div class="insight">${d.insights.map(i=>"• "+i).join("<br>")}${note?"<br>• "+note:""}</div>`;
    charts.push(new Chart(c1,{type:"line",data:{labels:[...Array(24).keys()],datasets:[{data:d.hours,borderColor:"#00D9FF",backgroundColor:"rgba(0,217,255,.16)",fill:true,tension:.35,pointRadius:0,borderWidth:2}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#8aa0b3",maxTicksLimit:8},grid:{display:false}},y:{ticks:{color:"#8aa0b3"},grid:{color:"rgba(255,255,255,.06)"}}}}}));
    charts.push(new Chart(c2,{type:"bar",data:{labels:d.top.map(x=>x[0]),datasets:[{data:d.top.map(x=>x[1]),backgroundColor:"#FF3B30"}]},options:{indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#8aa0b3"},grid:{display:false}},y:{ticks:{color:"#e8f4ff"},grid:{display:false}}}}}));
    charts.push(new Chart(c3,{type:"doughnut",data:{labels:["Occupati","Liberi"],datasets:[{data:[d.occ,d.lib],backgroundColor:["#FF3B30","#00D9FF"]}]},options:{plugins:{legend:{labels:{color:"#e8f4ff"}}}}}));
  }
  function renderFlow(){openHome();wipe();canvas.innerHTML=`<div class="status">HOME · PROCESSO</div><div class="flow"><div class="card"><b>TAVOLO</b></div><div>→</div><div class="card"><b>PRODOTTO</b></div><div>→</div><div class="card"><b>CUCINA/BAR</b></div><div>→</div><div class="card"><b>KDS</b></div></div>`;}
  function renderFarm(){openHome();wipe();canvas.innerHTML=`<div class="status">HOME · FATTORIA</div><div class="pics"><img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=600&q=60"><img src="https://images.unsplash.com/photo-1464226184884-fa280b87c399?auto=format&fit=crop&w=600&q=60"><img src="https://images.unsplash.com/photo-1466978913421-dad2ebd01d17?auto=format&fit=crop&w=600&q=60"><img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=600&q=60"></div><div class="kpis" style="margin-top:8px"><div class="card"><b>5.0</b><span>AGRITURISMO</span></div><div class="card"><b>KM0</b><span>PRODOTTI</span></div><div class="card"><b>EVENTI</b><span>LIVE</span></div><div class="card"><b>CONTENT</b><span>BRAND</span></div></div><div class="flow"><div class="card">TERRENO</div><div>→</div><div class="card">ORTO</div><div>→</div><div class="card">RISTORANTE</div><div>→</div><div class="card">BRAND</div></div>`;}
  async function run(text){
    busy(true);
    const k=kind(text);
    try{
      if(k==="farm") renderFarm();
      else if(k==="flow") renderFlow();
      else if(k==="dash"){
        const m=text.toLowerCase().match(/coca|fish tacos|royal|heineken|burger/);
        renderDash(pack(await orders(), m&&m[0]));
      } else { openHome(); wipe(); canvas.innerHTML=`<div class="status">HOME</div><div class="card"><b>In ascolto</b><span>Il contenuto arriva qui, non in chat.</span></div>`; }
    }catch(e){ canvas.innerHTML=`<div class="card">HUD occupato</div>`; openHome(); }
    try{
      const res=await fetch(API+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});
      const data=await res.json();
      const reply=data.risposta||"Fatto.";
      speak(reply);
      const box=document.createElement("div"); box.className="insight"; box.textContent=reply; canvas.appendChild(box);
    }catch(e){}
    busy(false);
  }
  function send(){const t=input.value.trim();if(!t)return;input.value="";run(t);}
  document.getElementById("btnSend").onclick=send;
  input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();send();}});
  document.getElementById("btnRep").onclick=()=>run("report giornaliero");
  document.getElementById("btnMic").onclick=function(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;if(!recognition){recognition=new SR();recognition.lang="it-IT";recognition.onresult=e=>{input.value=e.results[0][0].transcript;send();};recognition.onend=()=>{listening=false;document.getElementById("btnMic").classList.remove("on");};}if(!listening){listening=true;document.getElementById("btnMic").classList.add("on");recognition.start();}else recognition.stop();};
  document.getElementById("btnCam").onclick=async function(){openHome();wipe();canvas.innerHTML=`<div class="status">HOME · CAMERA</div><div class="card"><b>Camera</b><span>Permesso dispositivo</span></div>`;try{const s=await navigator.mediaDevices.getUserMedia({video:true});const v=document.createElement("video");v.autoplay=true;v.playsInline=true;v.style.width="100%";v.style.borderRadius="18px";v.srcObject=s;canvas.appendChild(v);speak("Camera attiva in home.");}catch(e){speak("Permesso camera negato.");}};
  speak("Home OS online.");
})();
</script></body></html>
