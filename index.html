<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS · Teste Matte</title>
<style>
  :root {
    --bg: #06070a;
    --grid: rgba(45, 166, 176, 0.08);
    --teal: #2da6b0;
    --teal-l: #5fd8e0;
    --glow: rgba(45, 166, 176, 0.6);
    --ink: #e8f4f4;
    --muted: #7a8f92;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  body {
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* TOP BAR */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 20px;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(180deg, rgba(6,7,10,0.9), transparent);
    z-index: 20;
  }
  .brand { font-size: 13px; letter-spacing: 3px; color: var(--teal-l); opacity: 0.7; }
  .status {
    font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #47c98a; box-shadow: 0 0 10px #47c98a;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* CENTER RING */
  .center {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 24px;
  }
  .ring-wrap {
    position: relative; width: 220px; height: 220px;
  }
  .ring {
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 2px solid var(--teal);
    box-shadow:
      0 0 20px var(--glow),
      0 0 60px rgba(45,166,176,0.25),
      inset 0 0 30px rgba(45,166,176,0.15);
    animation: spin 12s linear infinite;
    position: relative;
  }
  .ring::before {
    content: '';
    position: absolute; inset: 12px;
    border-radius: 50%;
    border: 1px solid rgba(95,216,224,0.4);
  }
  .ring::after {
    content: '';
    position: absolute; inset: -8px;
    border-radius: 50%;
    border: 1px dashed rgba(45,166,176,0.3);
    animation: spin 20s linear infinite reverse;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .ring-label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 4px;
    pointer-events: none;
  }
  .ring-label b {
    font-size: 28px; letter-spacing: 6px;
    color: var(--teal-l);
    text-shadow: 0 0 20px var(--glow);
  }
  .ring-label span {
    font-size: 11px; letter-spacing: 2px; color: var(--muted);
  }

  /* CAMERA PREVIEW */
  .cam-box {
    position: absolute; top: 80px; left: 24px;
    width: 180px; height: 120px;
    border: 1px solid rgba(45,166,176,0.4);
    border-radius: 8px;
    overflow: hidden;
    background: #0b0d11;
    display: none;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  .cam-box video {
    width: 100%; height: 100%; object-fit: cover;
  }
  .cam-label {
    position: absolute; bottom: 4px; left: 6px;
    font-size: 10px; color: var(--teal-l); letter-spacing: 1px;
  }

  /* CHAT PANEL */
  .chat-panel {
    position: absolute; top: 80px; right: 24px;
    width: 280px; max-height: 320px;
    background: rgba(11,13,17,0.85);
    border: 1px solid rgba(45,166,176,0.25);
    border-radius: 12px;
    backdrop-filter: blur(12px);
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    padding: 10px 14px;
    font-size: 11px; letter-spacing: 2px; color: var(--teal-l);
    border-bottom: 1px solid rgba(45,166,176,0.15);
  }
  .chat-log {
    flex: 1; overflow-y: auto; padding: 12px;
    font-size: 13px; line-height: 1.45;
  }
  .chat-log .user { color: var(--muted); margin-bottom: 6px; }
  .chat-log .jarvis { color: var(--teal-l); margin-bottom: 12px; }
  .chat-input-row {
    display: flex; border-top: 1px solid rgba(45,166,176,0.15);
  }
  .chat-input-row input {
    flex: 1; background: transparent; border: none;
    padding: 12px; color: var(--ink); font-size: 13px; outline: none;
  }
  .chat-input-row button {
    background: transparent; border: none; color: var(--teal);
    padding: 0 14px; cursor: pointer; font-size: 16px;
  }

  /* BOTTOM CONTROLS */
  .controls {
    position: absolute; bottom: 40px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 16px;
  }
  .btn {
    padding: 12px 22px;
    border-radius: 99px;
    border: 1px solid rgba(45,166,176,0.4);
    background: rgba(45,166,176,0.1);
    color: var(--teal-l);
    font-size: 13px; letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover, .btn.active {
    background: rgba(45,166,176,0.25);
    box-shadow: 0 0 20px var(--glow);
  }
  .btn.mic.active {
    background: rgba(226,87,76,0.2);
    border-color: #e2574c;
    color: #ff8a80;
  }

  /* STATUS TEXT */
  .status-text {
    position: absolute; bottom: 110px; left: 0; right: 0;
    text-align: center;
    font-size: 14px; color: var(--muted);
    letter-spacing: 1px;
    min-height: 20px;
  }

  /* RESPONSIVE */
  @media (max-width: 700px) {
    .cam-box, .chat-panel { display: none !important; }
    .ring-wrap { width: 180px; height: 180px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">TESTE MATTE · JARVIS</div>
    <div class="status"><span class="dot"></span> ONLINE</div>
  </div>

  <div class="cam-box" id="camBox">
    <video id="camVideo" autoplay muted playsinline></video>
    <div class="cam-label">CAMERA</div>
  </div>

  <div class="chat-panel" id="chatPanel">
    <div class="chat-header">CHAT</div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <input id="chatInput" placeholder="Scrivi o parla..." autocomplete="off">
      <button onclick="sendText()">➤</button>
    </div>
  </div>

  <div class="center">
    <div class="ring-wrap">
      <div class="ring"></div>
      <div class="ring-label">
        <b>JARVIS</b>
        <span id="timeLabel">--:--</span>
      </div>
    </div>
  </div>

  <div class="status-text" id="statusText">Di' "Okay Jarvis" oppure clicca il microfono</div>

  <div class="controls">
    <button class="btn" id="btnCam" onclick="toggleCam()">CAMERA</button>
    <button class="btn mic" id="btnMic" onclick="toggleMic()">MIC</button>
    <button class="btn" id="btnChat" onclick="toggleChat()">CHAT</button>
  </div>

<script>
  // ========== CONFIG ==========
  const BACKEND = "https://jarvis-teste-matte.onrender.com"; // cambia se diverso
  let listening = false;
  let camOn = false;
  let chatOn = false;
  let recognition = null;
  let synth = window.speechSynthesis;

  // ========== CLOCK ==========
  function updateClock() {
    const now = new Date();
    document.getElementById("timeLabel").textContent =
      now.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ========== SPEAK ==========
  function speak(text) {
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "it-IT";
    u.rate = 1.05;
    u.pitch = 0.95;
    // Preferisci voce maschile se disponibile
    const voices = synth.getVoices();
    const it = voices.find(v => v.lang.startsWith("it") && v.name.toLowerCase().includes("male"))
            || voices.find(v => v.lang.startsWith("it"));
    if (it) u.voice = it;
    synth.speak(u);
    setStatus(text);
  }

  // ========== STATUS ==========
  function setStatus(t) {
    document.getElementById("statusText").textContent = t;
  }

  // ========== CHAT LOG ==========
  function addLog(who, text) {
    const log = document.getElementById("chatLog");
    const div = document.createElement("div");
    div.className = who;
    div.textContent = (who === "user" ? "Tu: " : "Jarvis: ") + text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  // ========== BACKEND CALL ==========
  async function askJarvis(text) {
    addLog("user", text);
    setStatus("Elaboro...");
    try {
      // Prova a chiamare il backend se ha endpoint /chat
      // Altrimenti risponde localmente con frasi Iron Man style
      const res = await fetch(BACKEND + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      }).catch(() => null);

      let reply = "A disposizione, signore.";
      if (res && res.ok) {
        const data = await res.json();
        reply = data.reply || data.response || reply;
      } else {
        // Fallback locale stile Iron Man
        const t = text.toLowerCase();
        if (t.includes("camera") || t.includes("telecamera")) {
          reply = "Apro la camera.";
          if (!camOn) toggleCam();
        } else if (t.includes("chat") || t.includes("messaggi")) {
          reply = "Apro la chat.";
          if (!chatOn) toggleChat();
        } else if (t.includes("ciao") || t.includes("sei lì") || t.includes("are you there")) {
          reply = "A disposizione, signore.";
        } else if (t.includes("pronto") || t.includes("ready")) {
          reply = "Sono pronto, signore.";
        } else {
          reply = "Ricevuto. In che modo posso assisterla?";
        }
      }
      addLog("jarvis", reply);
      speak(reply);
    } catch (e) {
      const fallback = "Sistemi operativi. Come posso aiutarla?";
      addLog("jarvis", fallback);
      speak(fallback);
    }
  }

  // ========== WAKE WORD + STT ==========
  function initRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setStatus("Riconoscimento vocale non supportato su questo browser");
      return null;
    }
    const r = new SR();
    r.lang = "it-IT";
    r.continuous = true;
    r.interimResults = false;

    r.onresult = (e) => {
      const last = e.results[e.results.length - 1];
      if (!last.isFinal) return;
      const text = last[0].transcript.trim();
      console.log("Heard:", text);

      // Wake word
      const lower = text.toLowerCase();
      if (lower.includes("okay jarvis") || lower.includes("ok jarvis") ||
          lower.includes("ehi jarvis") || lower.startsWith("jarvis")) {
        // Rimuovi wake word
        let cmd = text.replace(/okay jarvis|ok jarvis|ehi jarvis|jarvis/gi, "").trim();
        if (!cmd) {
          speak("A disposizione, signore.");
          return;
        }
        askJarvis(cmd);
      } else if (listening) {
        // Se microfono manuale attivo, accetta tutto
        askJarvis(text);
      }
    };

    r.onerror = (e) => {
      console.warn("Speech error", e.error);
      if (e.error === "not-allowed") setStatus("Permesso microfono negato");
    };

    r.onend = () => {
      if (listening) {
        try { r.start(); } catch (_) {}
      }
    };

    return r;
  }

  function toggleMic() {
    if (!recognition) recognition = initRecognition();
    if (!recognition) return;

    listening = !listening;
    const btn = document.getElementById("btnMic");
    if (listening) {
      btn.classList.add("active");
      try { recognition.start(); } catch (_) {}
      setStatus("In ascolto... Di' \"Okay Jarvis\"");
      speak("In ascolto.");
    } else {
      btn.classList.remove("active");
      recognition.stop();
      setStatus("Microfono spento");
    }
  }

  // ========== CAMERA ==========
  async function toggleCam() {
    const box = document.getElementById("camBox");
    const video = document.getElementById("camVideo");
    if (!camOn) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
        box.style.display = "block";
        camOn = true;
        document.getElementById("btnCam").classList.add("active");
        speak("Camera attiva.");
      } catch (e) {
        speak("Impossibile accedere alla camera.");
        setStatus("Camera non disponibile");
      }
    } else {
      const stream = video.srcObject;
      if (stream) stream.getTracks().forEach(t => t.stop());
      video.srcObject = null;
      box.style.display = "none";
      camOn = false;
      document.getElementById("btnCam").classList.remove("active");
      speak("Camera disattivata.");
    }
  }

  // ========== CHAT ==========
  function toggleChat() {
    chatOn = !chatOn;
    document.getElementById("chatPanel").style.display = chatOn ? "flex" : "none";
    document.getElementById("btnChat").classList.toggle("active", chatOn);
    if (chatOn) document.getElementById("chatInput").focus();
  }

  function sendText() {
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    askJarvis(text);
  }

  document.getElementById("chatInput").addEventListener("keydown", e => {
    if (e.key === "Enter") sendText();
  });

  // ========== START ==========
  window.speechSynthesis.onvoiceschanged = () => {};
  // Avvio automatico leggero
  setTimeout(() => {
    speak("Sistemi online. A disposizione, signore.");
  }, 800);
</script>
</body>
</html>
