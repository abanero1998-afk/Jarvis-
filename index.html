<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<title>JARVIS · Teste Matte</title>
<style>
  :root { --bg:#06070a; --grid:rgba(45,166,176,.08); --teal:#2da6b0; --teal-l:#5fd8e0; --glow:rgba(45,166,176,.6); --ink:#e8f4f4; --muted:#7a8f92; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
  body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
  .topbar{position:absolute;top:0;left:0;right:0;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;z-index:20}
  .brand{font-size:12px;letter-spacing:3px;color:var(--teal-l);opacity:.7}
  .status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:#47c98a;box-shadow:0 0 10px #47c98a;animation:pulse 2s infinite}
  .dot.off{background:#e2574c;box-shadow:0 0 10px #e2574c}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .center{position:absolute;inset:0 0 280px 0;display:flex;align-items:center;justify-content:center}
  .ring-wrap{position:relative;width:200px;height:200px}
  .ring{width:100%;height:100%;border-radius:50%;border:2px solid var(--teal);box-shadow:0 0 20px var(--glow),0 0 60px rgba(45,166,176,.25),inset 0 0 30px rgba(45,166,176,.15);animation:spin 12s linear infinite}
  .ring::before{content:'';position:absolute;inset:14px;border-radius:50%;border:1px solid rgba(95,216,224,.4)}
  .ring::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px dashed rgba(45,166,176,.3);animation:spin 20s linear infinite reverse}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;pointer-events:none}
  .ring-label b{font-size:28px;letter-spacing:8px;color:var(--teal-l);text-shadow:0 0 24px var(--glow)}
  .ring-label span{font-size:13px;letter-spacing:3px;color:var(--muted)}
  .chat-panel{position:absolute;bottom:76px;left:10px;right:10px;max-width:460px;margin:0 auto;height:230px;background:rgba(11,13,17,.94);border:1px solid rgba(45,166,176,.35);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;z-index:30}
  .chat-header{padding:10px 14px;font-size:11px;letter-spacing:2px;color:var(--teal-l);border-bottom:1px solid rgba(45,166,176,.15);display:flex;justify-content:space-between}
  .chat-log{flex:1;overflow-y:auto;padding:12px;font-size:14px;line-height:1.45}
  .chat-log .user{color:var(--muted);margin-bottom:8px}
  .chat-log .jarvis{color:var(--teal-l);margin-bottom:12px;white-space:pre-wrap}
  .chat-input-row{display:flex;border-top:1px solid rgba(45,166,176,.15)}
  .chat-input-row input{flex:1;background:transparent;border:none;padding:14px;color:var(--ink);font-size:15px;outline:none}
  .chat-input-row button{background:transparent;border:none;color:var(--teal);padding:0 16px;cursor:pointer;font-size:18px}
  .controls{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:40}
  .btn{padding:10px 16px;border-radius:99px;border:1px solid rgba(45,166,176,.4);background:rgba(45,166,176,.12);color:var(--teal-l);font-size:12px;letter-spacing:1px;cursor:pointer}
  .btn.mic.active{background:rgba(226,87,76,.25);border-color:#e2574c;color:#ff8a80}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">TESTE MATTE · JARVIS</div>
    <div class="status"><span class="dot" id="dot"></span> <span id="stLabel">ONLINE</span></div>
  </div>
  <div class="center">
    <div class="ring-wrap">
      <div class="ring"></div>
      <div class="ring-label"><b>JARVIS</b><span id="clock">--:--</span></div>
    </div>
  </div>
  <div class="chat-panel">
    <div class="chat-header"><span>CHAT</span><span id="brainStatus">collegamento...</span></div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <input id="chatInput" placeholder="Parla con Jarvis..." autocomplete="off">
      <button id="btnSend">➤</button>
    </div>
  </div>
  <div class="controls">
    <button class="btn" id="btnCam">CAMERA</button>
    <button class="btn mic" id="btnMic">MIC</button>
  </div>
<script>
(function(){
  const BACKENDS=["https://jarvis-teste-matte.onrender.com", window.location.origin];
  let BACKEND=BACKENDS[0];
  const logEl=document.getElementById("chatLog");
  const inputEl=document.getElementById("chatInput");
  const btnSend=document.getElementById("btnSend");
  const btnMic=document.getElementById("btnMic");
  const brainEl=document.getElementById("brainStatus");
  const clockEl=document.getElementById("clock");
  const dotEl=document.getElementById("dot");
  const stEl=document.getElementById("stLabel");
  let listening=false, recognition=null, jarvisVoice=null;

  function pickVoice(){
    const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    const score = function(v){
      const n = (v.name||"").toLowerCase();
      const l = (v.lang||"").toLowerCase();
      let s = 0;
      if (l.indexOf("it")===0) s += 80;
      if (n.indexOf("italian")>=0 || n.indexOf("italiano")>=0) s += 40;
      if (n.indexOf("alice")>=0 || n.indexOf("federica")>=0 || n.indexOf("luca")>=0 || n.indexOf("paola")>=0) s += 20;
      if (n.indexOf("male")>=0 || n.indexOf("uomo")>=0 || n.indexOf("luca")>=0) s += 15;
      if (n.indexOf("siri")>=0) s += 10;
      if (n.indexOf("google")>=0) s += 5;
      return s;
    };
    voices.sort(function(a,b){ return score(b)-score(a); });
    jarvisVoice = voices[0] || null;
  }
  if (window.speechSynthesis){
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }

  function cleanSpeak(text){
    let t = String(text||"");
    t = t.replace(/\*\*/g,"").replace(/\*/g,"");
    t = t.replace(/ANALISI\s*:/gi,"");
    t = t.replace(/AZIONE\s*:/gi,"");
    t = t.replace(/RISULTATO\s*:/gi,"");
    t = t.replace(/\n+/g,". ").replace(/\s+/g," ").trim();
    const parts = t.split(/(?<=[.!?])\s+/);
    return parts.slice(0,2).join(" ") || t.slice(0,180);
  }

  function speak(text){
    try{
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(cleanSpeak(text));
      u.lang = "it-IT";
      if (jarvisVoice) u.voice = jarvisVoice;
      u.rate = 0.92;
      u.pitch = 0.82;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function tick(){ clockEl.textContent=new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}); }
  setInterval(tick,1000); tick();
  function setOnline(ok){ dotEl.classList.toggle("off",!ok); stEl.textContent=ok?"ONLINE":"OFFLINE"; brainEl.textContent=ok?"cervello online":"offline"; }
  function addLog(who,text){ const d=document.createElement("div"); d.className=who; d.textContent=(who==="user"?"Tu: ":"Jarvis: ")+text; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }
  async function fetchJson(url,opts,ms){ const c=new AbortController(); const t=setTimeout(()=>c.abort(), ms||25000); try{ return await fetch(url, Object.assign({signal:c.signal}, opts)); } finally{ clearTimeout(t); } }
  async function wake(){ for(const base of BACKENDS){ try{ const r=await fetchJson(base+"/health",{method:"GET"},12000); if(r&&r.ok){ BACKEND=base; setOnline(true); return true; } }catch(e){} try{ const r2=await fetchJson(base+"/",{method:"GET"},12000); if(r2&&r2.ok){ BACKEND=base; setOnline(true); return true; } }catch(e){} } setOnline(false); return false; }
  async function askBrain(text){ addLog("user",text); brainEl.textContent="pensando..."; let last=null; for(let i=0;i<3;i++){ try{ await wake(); const res=await fetchJson(BACKEND+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})},28000); if(!res.ok) throw new Error("HTTP "+res.status); const data=await res.json(); const reply=data.risposta||data.reply||data.response||JSON.stringify(data); addLog("jarvis",reply); speak(reply); setOnline(true); return; }catch(e){ last=e; } } addLog("jarvis","Cervello in riscaldamento. Riprova tra 20 secondi."); speak("Sistemi in riscaldamento, signore."); setOnline(false); console.error(last); }
  function send(){ const text=inputEl.value.trim(); if(!text) return; inputEl.value=""; askBrain(text); }
  btnSend.addEventListener("click",send);
  inputEl.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); send(); } });
  btnMic.addEventListener("click",function(){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ brainEl.textContent="mic non supportato"; return;} if(!recognition){ recognition=new SR(); recognition.lang="it-IT"; recognition.continuous=false; recognition.onresult=function(e){ inputEl.value=e.results[0][0].transcript; send(); }; recognition.onerror=recognition.onend=function(){ listening=false; btnMic.classList.remove("active"); }; } if(!listening){ listening=true; btnMic.classList.add("active"); try{recognition.start();}catch(e){} } else { recognition.stop(); listening=false; btnMic.classList.remove("active"); } });
  document.getElementById("btnCam").addEventListener("click",function(){ addLog("jarvis","Camera non ancora collegata su questo dispositivo."); });
  setTimeout(function(){ addLog("jarvis","Sistemi online. A disposizione, signore."); speak("Sistemi online. A disposizione, signore."); wake(); },500);
  setInterval(wake,180000);
  setTimeout(function(){ inputEl.focus(); },700);
})();
</script>
</body>
</html>
