<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS · Teste Matte</title>
<style>
  :root {
    --bg: #06070a;
    --grid: rgba(45, 166, 176, 0.08);
    --teal: #2da6b0;
    --teal-l: #5fd8e0;
    --glow: rgba(45, 166, 176, 0.6);
    --ink: #e8f4f4;
    --muted: #7a8f92;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  body {
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 20px;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(180deg, rgba(6,7,10,0.9), transparent);
    z-index: 20;
  }
  .brand { font-size: 13px; letter-spacing: 3px; color: var(--teal-l); opacity: 0.7; }
  .status {
    font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #47c98a; box-shadow: 0 0 10px #47c98a;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .center {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .ring-wrap {
    position: relative; width: 200px; height: 200px;
  }
  .ring {
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 2px solid var(--teal);
    box-shadow:
      0 0 20px var(--glow),
      0 0 60px rgba(45,166,176,0.25),
      inset 0 0 30px rgba(45,166,176,0.15);
    animation: spin 12s linear infinite;
  }
  .ring::before {
    content: '';
    position: absolute; inset: 14px;
    border-radius: 50%;
    border: 1px solid rgba(95,216,224,0.4);
  }
  .ring::after {
    content: '';
    position: absolute; inset: -8px;
    border-radius: 50%;
    border: 1px dashed rgba(45,166,176,0.3);
    animation: spin 20s linear infinite reverse;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .ring-label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .ring-label b {
    font-size: 30px; letter-spacing: 8px;
    color: var(--teal-l);
    text-shadow: 0 0 24px var(--glow);
  }
  .chat-panel {
    position: absolute;
    bottom: 80px; left: 10px; right: 10px;
    max-width: 440px;
    margin: 0 auto;
    height: 240px;
    background: rgba(11,13,17,0.94);
    border: 1px solid rgba(45,166,176,0.35);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 30;
  }
  .chat-header {
    padding: 10px 14px;
    font-size: 11px; letter-spacing: 2px; color: var(--teal-l);
    border-bottom: 1px solid rgba(45,166,176,0.15);
    display: flex; justify-content: space-between;
  }
  .chat-log {
    flex: 1; overflow-y: auto; padding: 12px;
    font-size: 14px; line-height: 1.45;
  }
  .chat-log .user { color: var(--muted); margin-bottom: 8px; }
  .chat-log .jarvis { color: var(--teal-l); margin-bottom: 12px; white-space: pre-wrap; }
  .chat-input-row {
    display: flex; border-top: 1px solid rgba(45,166,176,0.15);
  }
  .chat-input-row input {
    flex: 1; background: transparent; border: none;
    padding: 14px; color: var(--ink); font-size: 15px; outline: none;
  }
  .chat-input-row button {
    background: transparent; border: none; color: var(--teal);
    padding: 0 16px; cursor: pointer; font-size: 18px;
  }
  .controls {
    position: absolute; bottom: 16px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 12px;
    z-index: 40;
  }
  .btn {
    padding: 10px 16px;
    border-radius: 99px;
    border: 1px solid rgba(45,166,176,0.4);
    background: rgba(45,166,176,0.12);
    color: var(--teal-l);
    font-size: 12px; letter-spacing: 1px;
    cursor: pointer;
  }
  .btn.mic.active {
    background: rgba(226,87,76,0.25);
    border-color: #e2574c;
    color: #ff8a80;
  }
  .status-text {
    position: absolute; bottom: 60px; left: 0; right: 0;
    text-align: center;
    font-size: 12px; color: var(--muted);
    z-index: 20;
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">TESTE MATTE · JARVIS</div>
    <div class="status"><span class="dot"></span> ONLINE</div>
  </div>

  <div class="center">
    <div class="ring-wrap">
      <div class="ring"></div>
      <div class="ring-label">
        <b>JARVIS</b>
      </div>
    </div>
  </div>

  <div class="status-text" id="statusText">Collegato al cervello completo</div>

  <div class="chat-panel">
    <div class="chat-header">
      <span>CHAT</span>
      <span id="brainStatus" style="font-size:10px;opacity:0.6">cervello online</span>
    </div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <input id="chatInput" placeholder="Chiedi qualsiasi cosa..." autocomplete="off">
      <button id="btnSend">➤</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="btnCam">CAMERA</button>
    <button class="btn mic" id="btnMic">MIC</button>
  </div>

<script>
(function() {
  const BACKEND = "https://jarvis-teste-matte.onrender.com";
  const statusEl = document.getElementById("statusText");
  const logEl = document.getElementById("chatLog");
  const inputEl = document.getElementById("chatInput");
  const btnSend = document.getElementById("btnSend");
  const btnMic = document.getElementById("btnMic");
  const brainEl = document.getElementById("brainStatus");

  let listening = false;
  let recognition = null;

  function addLog(who, text) {
    const div = document.createElement("div");
    div.className = who;
    div.textContent = (who === "user" ? "Tu: " : "Jarvis: ") + text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function speak(text) {
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const short = text.split(/[.!?]/).slice(0, 2).join(". ").trim();
      const u = new SpeechSynthesisUtterance(short || text);
      u.lang = "it-IT";
      u.rate = 1.05;
      window.speechSynthesis.speak(u);
    } catch (e) {}
    statusEl.textContent = text.slice(0, 80) + (text.length > 80 ? "…" : "");
  }

  async function askBrain(text) {
    addLog("user", text);
    statusEl.textContent = "Elaboro con il cervello completo...";
    brainEl.textContent = "pensando...";

    try {
      const res = await fetch(BACKEND + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });

      if (!res.ok) throw new Error("status " + res.status);

      const data = await res.json();
      const reply = data.risposta || data.reply || data.response || data.message || JSON.stringify(data);

      addLog("jarvis", reply);
      speak(reply);
      brainEl.textContent = "cervello online";
    } catch (e) {
      console.error(e);
      const fallback = "Cervello temporaneamente offline. Riprova tra poco.";
      addLog("jarvis", fallback);
      speak(fallback);
      brainEl.textContent = "offline";
    }
  }

  function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    askBrain(text);
  }

  btnSend.addEventListener("click", send);
  inputEl.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      send();
    }
  });

  btnMic.addEventListener("click", function() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      statusEl.textContent = "Microfono non supportato";
      return;
    }
    if (!recognition) {
      recognition = new SR();
      recognition.lang = "it-IT";
      recognition.continuous = false;
      recognition.onresult = function(e) {
        const text = e.results[0][0].transcript;
        inputEl.value = text;
        send();
      };
      recognition.onerror = function() {
        listening = false;
        btnMic.classList.remove("active");
      };
      recognition.onend = function() {
        listening = false;
        btnMic.classList.remove("active");
      };
    }
    if (!listening) {
      listening = true;
      btnMic.classList.add("active");
      statusEl.textContent = "Parla ora...";
      try { recognition.start(); } catch (e) {}
    } else {
      recognition.stop();
      listening = false;
      btnMic.classList.remove("active");
    }
  });

  document.getElementById("btnCam").addEventListener("click", function() {
    statusEl.textContent = "Camera in arrivo";
    speak("Camera non ancora collegata.");
  });

  setTimeout(function() {
    addLog("jarvis", "Sistemi online. Cervello completo collegato. A disposizione, signore.");
    speak("Sistemi online. A disposizione, signore.");
  }, 500);

  setTimeout(function() { inputEl.focus(); }, 700);
})();
</script>
</body>
</html>
